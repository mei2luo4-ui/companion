<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新霓虹 · 跨界</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="54" height="54" rx="8" stroke="#ff6b9d" stroke-width="1.5" stroke-dasharray="4 3"/>
        <circle cx="28" cy="28" r="10" stroke="#ff6b9d" stroke-width="1.5"/>
        <circle cx="28" cy="28" r="3" fill="#ff6b9d"/>
        <line x1="28" y1="8" x2="28" y2="18" stroke="#ff6b9d" stroke-width="1.5"/>
        <line x1="28" y1="38" x2="28" y2="48" stroke="#ff6b9d" stroke-width="1.5"/>
        <line x1="8" y1="28" x2="18" y2="28" stroke="#ff6b9d" stroke-width="1.5"/>
        <line x1="38" y1="28" x2="48" y2="28" stroke="#ff6b9d" stroke-width="1.5"/>
        <line x1="14" y1="14" x2="20" y2="20" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
        <line x1="42" y1="14" x2="36" y2="20" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
        <line x1="14" y1="42" x2="20" y2="36" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
        <line x1="42" y1="42" x2="36" y2="36" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
        <rect x="24" y="4" width="8" height="3" rx="1" fill="#ff6b9d" opacity="0.6"/>
        <rect x="24" y="49" width="8" height="3" rx="1" fill="#ff6b9d" opacity="0.6"/>
      </svg>
    </div>
    <h1 class="auth-title">新霓虹 · 跨界</h1>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin">登录</button>
      <button class="auth-tab" id="tabRegister">注册</button>
    </div>

    <div id="loginForm">
      <input class="auth-input" id="loginUsername" type="text" placeholder="用户名" maxlength="20">
      <input class="auth-input" id="loginPassword" type="password" placeholder="密码" maxlength="50">
      <button class="btn-primary auth-btn" id="loginBtn">登录</button>
    </div>

    <div id="registerForm" class="hidden">
      <input class="auth-input" id="regUsername" type="text" placeholder="用户名（至少2位）" maxlength="20">
      <input class="auth-input" id="regPassword" type="password" placeholder="密码（至少6位）" maxlength="50">
      <button class="btn-primary auth-btn" id="registerBtn">注册</button>
    </div>

    <div class="auth-error hidden" id="authError"></div>
  </div>

  <script>
    if (localStorage.getItem('token')) location.href = 'index.html';

    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const authError = document.getElementById('authError');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      authError.classList.add('hidden');
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
      authError.classList.add('hidden');
    });

    function showError(msg) {
      authError.textContent = msg;
      authError.classList.remove('hidden');
    }

    async function doAuth(url, username, password) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '请求失败');
      return data.token;
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!username || !password) return showError('请填写用户名和密码');
      try {
        const token = await doAuth('/auth/login', username, password);
        localStorage.setItem('token', token);
        location.href = 'index.html';
      } catch (e) {
        showError(e.message);
      }
    });

    document.getElementById('registerBtn').addEventListener('click', async () => {
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      if (!username || !password) return showError('请填写用户名和密码');
      try {
        const token = await doAuth('/auth/register', username, password);
        localStorage.setItem('token', token);
        location.href = 'index.html';
      } catch (e) {
        showError(e.message);
      }
    });

    [document.getElementById('loginPassword'), document.getElementById('regPassword')].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') e.target.closest('div').querySelector('button').click(); });
    });
  </script>
</body>
</html>
