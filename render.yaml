services:
  - type: web
    name: companion
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: API_MODEL
        sync: false
      - key: SECRET_KEY
        generateValue: true
